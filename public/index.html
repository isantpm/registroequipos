<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d34"><title>Control de Equipos</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e293b;background:#f4f6f3;font-synthesis:none;--green:#17634c;--dark:#123d34;--muted:#718078;--line:#e2e9e3;--white:#fff}*{box-sizing:border-box}body{margin:0}.shell{min-height:100vh}.top{height:72px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1240px)/2))}.brand{display:flex;gap:12px;align-items:center;font-weight:700;letter-spacing:.01em}.brand-icon{width:38px;height:38px;border-radius:12px;background:#246b54;display:grid;place-items:center;font-size:19px}.top small{display:block;color:#b9d2c6;font-weight:400;font-size:12px;margin-top:2px}.top-right{display:flex;align-items:center;gap:16px;color:#d6e5dc;font-size:13px}.ghost{border:1px solid #527267;background:transparent;color:white;border-radius:9px;padding:9px 13px;cursor:pointer}main{max-width:1240px;margin:auto;padding:32px 24px 60px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.heading h1{font-size:27px;letter-spacing:-.035em;margin:0 0 6px;color:#172f28}.heading p{margin:0;color:var(--muted);font-size:14px}.pill{background:#e4eee8;color:#2a644d;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:650}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 12px #173d2b08}.metric{padding:19px 20px}.metric-label{font-size:12px;color:var(--muted);font-weight:550}.metric-value{font-size:29px;font-weight:700;letter-spacing:-.04em;margin-top:9px;color:#203d32}.metric-note{font-size:11px;color:#89978f;margin-top:4px}.row{display:grid;grid-template-columns:1.65fr 1fr;gap:18px}.panel{padding:21px}.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.panel h2{margin:0;font-size:16px;letter-spacing:-.02em}.sub{font-size:12px;color:var(--muted);margin-top:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{text-align:left;color:#839087;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.065em;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #eff2ef}tr:last-child td{border-bottom:0}.code{font-weight:700;color:#29483b}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700}.ok{background:#e5f3e9;color:#2f7950}.near{background:#fff4d7;color:#93610a}.critical{background:#ffe7d9;color:#ac4f20}.urgent{background:#fee5e5;color:#ae3030}.tabs{display:flex;gap:5px;background:#f0f4f0;padding:4px;border-radius:10px}.tab{border:0;background:transparent;color:#64756a;padding:8px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}.tab.active{background:white;color:#1d503e;box-shadow:0 1px 4px #143b2614}.btn{border:0;border-radius:9px;background:var(--green);color:#fff;padding:10px 14px;font-weight:650;font-size:12px;cursor:pointer}.btn.secondary{background:#edf3ef;color:#315c49}.btn.danger{background:#fff0ee;color:#a84135}.actions{display:flex;gap:6px}.empty{padding:28px;text-align:center;color:#8a978f;font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:11px;color:#586b60;font-weight:650;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dce5dd;border-radius:8px;background:#fff;padding:10px 11px;font:inherit;font-size:13px;color:#24372d}.field input:focus,.field select:focus{outline:2px solid #b7d8c3;border-color:#57906d}.field.full{grid-column:1/-1}.notice{border-radius:9px;padding:11px 13px;font-size:12px;margin-bottom:15px;background:#eff7f0;color:#3b704c}.notice.error{background:#fff0ed;color:#a74537}.stack{display:grid;gap:18px}.login{max-width:420px;margin:9vh auto;padding:30px}.login h1{font-size:23px;margin:0 0 5px}.login form,.stack-form{display:grid;gap:14px}.hidden{display:none!important}.rule{height:1px;background:var(--line);margin:16px 0}.count{font-size:11px;background:#f1f5f2;color:#617468;padding:5px 8px;border-radius:7px}.wide{grid-column:1/-1}.subnav{display:flex;gap:8px;align-items:center}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}@media(max-width:560px){.top{height:64px;padding:0 16px}.top-right #user-name{display:none}main{padding:23px 15px 40px}.heading{align-items:start;gap:12px;flex-direction:column}.heading h1{font-size:24px}.grid{gap:9px}.metric{padding:14px}.metric-value{font-size:25px}.metric-label{font-size:11px}.panel{padding:15px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.tabs{overflow:auto}.tab{white-space:nowrap}}
.maint-check{display:flex;align-items:center;gap:6px;color:#38634e;font-size:11px;font-weight:650;cursor:pointer}.maint-check input{accent-color:#17634c;width:15px;height:15px}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo-box{border:1px dashed #bacabe;border-radius:10px;padding:13px;background:#f8faf8}.photo-preview{display:none;width:100%;height:120px;object-fit:cover;border-radius:7px;margin-top:9px}.alert-dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 28px));box-shadow:0 25px 80px #102c2070;color:#20382d}.alert-dialog::backdrop{background:#10241e88;backdrop-filter:blur(3px)}.alert-head{padding:20px 22px 14px;border-bottom:1px solid var(--line)}.alert-head h2{margin:0;font-size:19px}.alert-body{padding:12px 22px;max-height:55vh;overflow:auto}.alert-item{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #eef2ee;font-size:13px}.alert-item:last-child{border-bottom:0}.alert-foot{padding:12px 22px 20px;display:flex;justify-content:flex-end}.photo-link{display:inline-block;color:#17634c;font-weight:600;margin-right:6px;font-size:11px}@media(max-width:560px){.photo-grid{grid-template-columns:1fr}}
</style></head>
<body><div id="app" class="shell"><header class="top"><div class="brand"><span class="brand-icon">⚙</span><span>Control de Equipos<small>Operación y mantenimiento</small></span></div><div id="top-right" class="top-right hidden"><span id="user-name"></span><button id="logout" class="ghost">Salir</button></div></header><main id="main"></main></div>
<script>
const main=document.querySelector('#main');let session=null,equipment=[],readings=[],tab='overview';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('es-DO',{maximumFractionDigits:1}).format(Number(n)||0);const statusName={ok:'Al día',near:'Próximo',critical:'Crítico',urgent:'Urgente'};const statusClass={ok:'ok',near:'near',critical:'critical',urgent:'urgent'};
async function api(path,options={}){const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await r.json();if(!r.ok)throw Error(data.error||'No se pudo completar la solicitud');return data}function notice(text,error=false){return `<div class="notice ${error?'error':''}">${esc(text)}</div>`}function login(){document.querySelector('#top-right').classList.add('hidden');main.innerHTML=`<section class="panel login"><div class="brand-icon" style="margin-bottom:18px">⚙</div><h1>Iniciar sesión</h1><p class="sub" style="margin:6px 0 22px">Accede al registro y control de equipos.</p><div id="message"></div><form id="login-form"><div class="field"><label>Usuario</label><input name="username" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn" style="padding:12px">Entrar</button></form><p class="sub" style="margin-top:18px">Solicita tu usuario al administrador del sistema.</p></section>`;document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});await start()}catch(err){document.querySelector('#message').innerHTML=notice(err.message,true)}}}
async function load(){const [e,r]=await Promise.all([api('/equipment'),api('/readings')]);equipment=e.equipment;readings=r.readings}let pollTimer=null;function layout(){document.querySelector('#top-right').classList.remove('hidden');document.querySelector('#user-name').textContent=session.username+(session.role==='admin'?' · Administrador':' · Campo');document.querySelector('#logout').onclick=async()=>{clearInterval(pollTimer);await api('/logout',{method:'POST'});session=null;login()};if(session.role==='admin'){adminView();clearInterval(pollTimer);pollTimer=setInterval(()=>{if(tab==='overview'&&!document.querySelector('#maintenance-alert[open]'))refresh().catch(()=>{})},15000)}else fieldViewV2()}
function metric(label,value,note){return `<article class="card metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></article>`}function equipmentTable(rows=equipment){if(!rows.length)return '<div class="empty">Todavía no hay equipos registrados.</div>';return `<div class="table-wrap"><table><thead><tr><th>Ficha / equipo</th><th>Marca y modelo</th><th>Horómetro</th><th>Próximo servicio</th><th>Restan</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${rows.map(e=>`<tr><td class="code">${esc(e.code)}</td><td>${esc(e.brand)} ${esc(e.model)}</td><td>${fmt(e.latest_hours)} h</td><td>${fmt(e.due_hours)} h</td><td>${e.remaining_hours<0?`${fmt(Math.abs(e.remaining_hours))} h vencido`: `${fmt(e.remaining_hours)} h`}</td><td><span class="tag ${statusClass[e.maintenance_state]}">${statusName[e.maintenance_state]}</span></td><td><label class="maint-check"><input type="checkbox" data-maintenance="${e.id}"> Mantenimiento realizado</label></td></tr>`).join('')}</tbody></table></div>`}
function header(title,desc,tag=''){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${tag?`<span class="pill">${tag}</span>`:''}</div>`}
function adminView(){
  const count=s=>equipment.filter(e=>e.maintenance_state===s).length;
  const active=equipment.filter(e=>e.maintenance_state!=='ok');
  const alertRows=active.map(e=>`<div class="alert-item"><span><strong>${esc(e.code)}</strong> · ${esc(e.brand)} ${esc(e.model)}<br><span class="sub">${e.remaining_hours<0?`${fmt(Math.abs(e.remaining_hours))} horas vencido`:`Faltan ${fmt(e.remaining_hours)} horas`}</span></span><span class="tag ${statusClass[e.maintenance_state]}">${statusName[e.maintenance_state]}</span></div>`).join('');
  main.innerHTML=`${header('Panel de mantenimiento','Resumen de flota y reportes enviados desde campo.',new Date().toLocaleDateString('es-DO',{day:'numeric',month:'long',year:'numeric'}))}<div class="grid">${metric('Equipos registrados',equipment.length,'Inventario activo')}${metric('Próximos',count('near'),'Dentro del umbral configurado')}${metric('Críticos',count('critical'),'En el punto de mantenimiento')}${metric('Urgentes',count('urgent'),'Horas de mantenimiento excedidas')}</div><section class="panel"><div class="panel-header"><div><h2>Flota y mantenimiento</h2><div class="sub">Marca la casilla para registrar un mantenimiento realizado y comenzar el siguiente ciclo.</div></div><div class="subnav"><button class="btn secondary" data-tab="users">+ Usuario</button><button class="btn" data-tab="equipment">+ Equipo</button></div></div>${equipmentTable()}</section><section class="panel" style="margin-top:18px"><div class="panel-header"><div><h2>Reportes de campo</h2><div class="sub">Las lecturas recibidas actualizan el horómetro y quedan pendientes de revisión.</div></div><span class="count">${readings.filter(r=>r.status==='pending').length} pendientes</span></div>${readingsTableWithPhotos()}</section><dialog class="alert-dialog" id="maintenance-alert"><div class="alert-head"><h2>⚠ Alertas de mantenimiento</h2><div class="sub">Hay equipos que requieren atención.</div></div><div class="alert-body">${alertRows}</div><div class="alert-foot"><button class="btn" id="close-alert">Entendido</button></div></dialog>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;adminSubView()});
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{await api(`/readings/${b.dataset.id}/${b.dataset.action}`,{method:'POST'});await refresh()}catch(e){alert(e.message)}});
  document.querySelectorAll('[data-maintenance]').forEach(input=>input.onchange=async()=>{if(!input.checked)return;if(!confirm('¿Confirmas que se realizó el mantenimiento de este equipo?')){input.checked=false;return}input.disabled=true;try{const result=await api(`/equipment/${input.dataset.maintenance}/maintenance`,{method:'POST'});alert(`Mantenimiento registrado a ${fmt(result.hours)} horas. El ciclo de alertas se reinició.`);await refresh()}catch(e){input.checked=false;input.disabled=false;alert(e.message)}});
  const close=document.querySelector('#close-alert');if(close)close.onclick=()=>document.querySelector('#maintenance-alert').close();
  if(active.length){const key=active.map(e=>`${e.id}:${e.maintenance_state}`).sort().join('|');if(sessionStorage.getItem('maintenance-alert-state')!==key){sessionStorage.setItem('maintenance-alert-state',key);document.querySelector('#maintenance-alert').showModal()}}else sessionStorage.removeItem('maintenance-alert-state');
}
function readingsTable(){if(!readings.length)return '<div class="empty">Aún no se han recibido lecturas.</div>';return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Operador</th><th>Horómetro</th><th>Comentarios</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${readings.map(r=>`<tr><td>${new Date(r.created_at+'Z').toLocaleString('es-DO',{dateStyle:'short',timeStyle:'short'})}</td><td class="code">${esc(r.code)}</td><td>${esc(r.username)}</td><td>${fmt(r.hours)} h</td><td>${esc(r.comments)||'—'}</td><td><span class="tag ${r.status==='pending'?'near':r.status==='confirmed'?'ok':'urgent'}">${r.status==='pending'?'Pendiente':r.status==='confirmed'?'Confirmado':'Rechazado'}</span></td><td>${r.status==='pending'?`<div class="actions"><button class="btn" data-action="confirm" data-id="${r.id}">Confirmar</button><button class="btn danger" data-action="reject" data-id="${r.id}">Rechazar</button></div>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}
function adminSubView(){if(tab==='overview')return adminView();if(tab==='equipment'){main.innerHTML=`${header('Registrar equipo','Crea la ficha maestra y define su ciclo de mantenimiento.')}<section class="panel"><div id="message"></div><form id="equipment-form" class="form-grid"><div class="field"><label>Ficha / código único</label><input name="code" placeholder="EQ-001" required></div><div class="field"><label>Marca</label><input name="brand" required></div><div class="field"><label>Modelo</label><input name="model" required></div><div class="field"><label>Número de serie (opcional)</label><input name="serial"></div><div class="field"><label>Intervalo entre mantenimientos (horas)</label><input type="number" name="interval_hours" min="1" step="0.1" placeholder="250" required></div><div class="field"><label>Horómetro actual</label><input type="number" name="current_hours" min="0" step="0.1" placeholder="1250" required></div><div class="field"><label>Alerta “próximo” (horas antes)</label><input type="number" name="warning_hours" min="0" step="0.1" value="50" required></div><div class="field full"><button class="btn">Guardar equipo</button> <button type="button" class="btn secondary" data-tab="overview">Cancelar</button></div></form></section>`;document.querySelector('#equipment-form').onsubmit=async e=>{e.preventDefault();try{await api('/equipment',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});await refresh();tab='overview';adminView()}catch(err){document.querySelector('#message').innerHTML=notice(err.message,true)}};document.querySelector('[data-tab=overview]').onclick=()=>{tab='overview';adminView()};return}if(tab==='users'){main.innerHTML=`${header('Crear usuario de campo','Cada persona tendrá su propio acceso para enviar lecturas.')}<section class="panel" style="max-width:620px"><div id="message"></div><form id="user-form" class="stack-form"><div class="field"><label>Nombre de usuario</label><input name="username" minlength="3" required></div><div class="field"><label>Contraseña temporal (mínimo 8 caracteres)</label><input name="password" type="password" minlength="8" required></div><button class="btn">Crear usuario</button><button class="btn secondary" type="button" data-tab="overview">Volver al panel</button></form></section>`;document.querySelector('#user-form').onsubmit=async e=>{e.preventDefault();try{await api('/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});document.querySelector('#message').innerHTML=notice('Usuario creado. Comparte sus credenciales de forma segura.');e.currentTarget.reset()}catch(err){document.querySelector('#message').innerHTML=notice(err.message,true)}};document.querySelector('[data-tab=overview]').onclick=()=>{tab='overview';adminView()}}}
function fieldView(){const mine=readings.filter(r=>r.user_id===session.id);main.innerHTML=`${header('Registro de campo','Envía la lectura actual del horómetro del equipo.')}<div class="row"><section class="panel"><h2>Nueva lectura</h2><p class="sub" style="margin:5px 0 18px">El sistema actualizará el horómetro en cuanto se reciba el reporte.</p><div id="message"></div>${equipment.length?`<form id="reading-form" class="stack-form"><div class="field"><label>Equipo / ficha</label><select name="equipment_id" required><option value="">Seleccionar equipo</option>${equipment.map(e=>`<option value="${e.id}">${esc(e.code)} · ${esc(e.brand)} ${esc(e.model)} (actual: ${fmt(e.latest_hours)} h)</option>`).join('')}</select></div><div class="field"><label>Horómetro actual</label><input name="hours" type="number" min="0" step="0.1" required></div><div class="field"><label>Observaciones (opcional)</label><textarea name="comments" rows="3" maxlength="500"></textarea></div><button class="btn">Enviar lectura</button></form>`:`<div class="empty">Todavía no hay equipos disponibles. Contacta al administrador.</div>`}</section><section class="panel"><h2>Mis últimos reportes</h2><p class="sub" style="margin:5px 0 12px">Historial de tus lecturas recientes.</p>${mine.length?`<div class="stack">${mine.slice(0,8).map(r=>`<div><div class="code">${esc(r.code)} · ${fmt(r.hours)} h</div><div class="sub">${new Date(r.created_at+'Z').toLocaleString('es-DO')} · ${r.status==='pending'?'Pendiente de revisión':r.status==='confirmed'?'Confirmado':'Rechazado'}</div></div>`).join('<div class="rule" style="margin:0"></div>')}</div>`:'<div class="empty">No has enviado lecturas todavía.</div>'}</section></div>`;const form=document.querySelector('#reading-form');if(form)form.onsubmit=async e=>{e.preventDefault();try{await api('/readings',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});await refresh();fieldView();document.querySelector('#message')?.replaceChildren()}catch(err){document.querySelector('#message').innerHTML=notice(err.message,true)}}}
function readingsTableWithPhotos(){if(!readings.length)return '<div class="empty">Aún no se han recibido lecturas.</div>';return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Operador</th><th>Horómetro</th><th>Fotos</th><th>Comentarios</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${readings.map(r=>`<tr><td>${new Date(r.created_at+'Z').toLocaleString('es-DO',{dateStyle:'short',timeStyle:'short'})}</td><td class="code">${esc(r.code)}</td><td>${esc(r.username)}</td><td>${fmt(r.hours)} h</td><td>${[r.photo1,r.photo2].filter(Boolean).map((p,i)=>`<a class="photo-link" href="/api/photos/${encodeURIComponent(p)}" target="_blank" rel="noopener">Foto ${i+1}</a>`).join('')||'—'}</td><td>${esc(r.comments)||'—'}</td><td><span class="tag ${r.status==='pending'?'near':r.status==='confirmed'?'ok':'urgent'}">${r.status==='pending'?'Pendiente':r.status==='confirmed'?'Confirmado':'Rechazado'}</span></td><td>${r.status==='pending'?`<div class="actions"><button class="btn" data-action="confirm" data-id="${r.id}">Confirmar</button><button class="btn danger" data-action="reject" data-id="${r.id}">Rechazar</button></div>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}
function readPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({type:file.type,data:reader.result});reader.onerror=()=>reject(new Error('No se pudo leer una de las fotos'));reader.readAsDataURL(file)})}
function fieldViewV2(){
  const mine=readings.filter(r=>r.user_id===session.id);
  main.innerHTML=`${header('Registro de campo','Envía la lectura actual del horómetro del equipo.')}<div class="row"><section class="panel"><h2>Nueva lectura</h2><p class="sub" style="margin:5px 0 18px">Adjunta dos fotos obligatorias. El horómetro se actualiza al recibir el reporte.</p><div id="message"></div>${equipment.length?`<form id="reading-form" class="stack-form"><div class="field"><label>Equipo / ficha</label><select name="equipment_id" required><option value="">Seleccionar equipo</option>${equipment.map(e=>`<option value="${e.id}">${esc(e.code)} · ${esc(e.brand)} ${esc(e.model)} (actual: ${fmt(e.latest_hours)} h)</option>`).join('')}</select></div><div class="field"><label>Horómetro actual</label><input name="hours" type="number" min="0" step="0.1" required></div><div class="photo-grid"><div class="photo-box"><div class="field"><label for="photo-one">Foto 1 (obligatoria)</label><input id="photo-one" type="file" accept="image/jpeg,image/png,image/webp" required></div><img id="preview-one" class="photo-preview" alt="Vista previa de la foto 1"></div><div class="photo-box"><div class="field"><label for="photo-two">Foto 2 (obligatoria)</label><input id="photo-two" type="file" accept="image/jpeg,image/png,image/webp" required></div><img id="preview-two" class="photo-preview" alt="Vista previa de la foto 2"></div></div><div class="field"><label>Observaciones (opcional)</label><textarea name="comments" rows="3" maxlength="500"></textarea></div><button class="btn" id="send-reading">Enviar lectura</button></form>`:`<div class="empty">Todavía no hay equipos disponibles. Contacta al administrador.</div>`}</section><section class="panel"><h2>Mis últimos reportes</h2><p class="sub" style="margin:5px 0 12px">Historial de tus lecturas recientes.</p>${mine.length?`<div class="stack">${mine.slice(0,8).map(r=>`<div><div class="code">${esc(r.code)} · ${fmt(r.hours)} h</div><div class="sub">${new Date(r.created_at+'Z').toLocaleString('es-DO')} · ${r.status==='pending'?'Pendiente de revisión':r.status==='confirmed'?'Confirmado':'Rechazado'}</div></div>`).join('<div class="rule" style="margin:0"></div>')}</div>`:'<div class="empty">No has enviado lecturas todavía.</div>'}</section></div>`;
  for(const [inputId,previewId] of [['photo-one','preview-one'],['photo-two','preview-two']])document.querySelector(`#${inputId}`)?.addEventListener('change',event=>{const file=event.target.files[0],preview=document.querySelector(`#${previewId}`);if(!file)return;if(file.size>10*1024*1024){event.target.value='';document.querySelector('#message').innerHTML=notice('Cada foto debe pesar menos de 10 MB.',true);preview.style.display='none';return}preview.src=URL.createObjectURL(file);preview.style.display='block'});
  const form=document.querySelector('#reading-form');
  if(form)form.onsubmit=async event=>{event.preventDefault();const files=[document.querySelector('#photo-one').files[0],document.querySelector('#photo-two').files[0]],button=document.querySelector('#send-reading');button.disabled=true;button.textContent='Enviando fotos y lectura…';try{const values=Object.fromEntries(new FormData(form));values.photos=await Promise.all(files.map(readPhoto));await api('/readings',{method:'POST',body:JSON.stringify(values)});await refresh();alert('Lectura recibida. El horómetro y el estado de mantenimiento ya fueron actualizados.')}catch(error){document.querySelector('#message').innerHTML=notice(error.message,true);button.disabled=false;button.textContent='Enviar lectura'}};
}
async function refresh(){await load();layout()}async function start(){try{const {user}=await api('/session');if(!user)return login();session=user;if(session.role==='admin')tab='overview';await load();layout()}catch{login()}}
start();
</script></body></html>
