<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d34"><title>Control de Equipos</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e293b;background:#f4f6f3;font-synthesis:none;--green:#17634c;--dark:#123d34;--muted:#718078;--line:#e2e9e3;--white:#fff}*{box-sizing:border-box}body{margin:0}.shell{min-height:100vh}.top{height:72px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1240px)/2))}.brand{display:flex;gap:12px;align-items:center;font-weight:700;letter-spacing:.01em}.brand-icon{width:38px;height:38px;border-radius:12px;background:#246b54;display:grid;place-items:center;font-size:19px}.top small{display:block;color:#b9d2c6;font-weight:400;font-size:12px;margin-top:2px}.top-right{display:flex;align-items:center;gap:16px;color:#d6e5dc;font-size:13px}.ghost{border:1px solid #527267;background:transparent;color:white;border-radius:9px;padding:9px 13px;cursor:pointer}main{max-width:1240px;margin:auto;padding:32px 24px 60px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.heading h1{font-size:27px;letter-spacing:-.035em;margin:0 0 6px;color:#172f28}.heading p{margin:0;color:var(--muted);font-size:14px}.pill{background:#e4eee8;color:#2a644d;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:650}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 12px #173d2b08}.metric{padding:19px 20px}.metric-label{font-size:12px;color:var(--muted);font-weight:550}.metric-value{font-size:29px;font-weight:700;letter-spacing:-.04em;margin-top:9px;color:#203d32}.metric-note{font-size:11px;color:#89978f;margin-top:4px}.row{display:grid;grid-template-columns:1.65fr 1fr;gap:18px}.panel{padding:21px}.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.panel h2{margin:0;font-size:16px;letter-spacing:-.02em}.sub{font-size:12px;color:var(--muted);margin-top:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{text-align:left;color:#839087;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.065em;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #eff2ef}tr:last-child td{border-bottom:0}.code{font-weight:700;color:#29483b}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:700}.ok{background:#e5f3e9;color:#2f7950}.near{background:#fff4d7;color:#93610a}.critical{background:#ffe7d9;color:#ac4f20}.urgent{background:#fee5e5;color:#ae3030}.tabs{display:flex;gap:5px;background:#f0f4f0;padding:4px;border-radius:10px}.tab{border:0;background:transparent;color:#64756a;padding:8px 11px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}.tab.active{background:white;color:#1d503e;box-shadow:0 1px 4px #143b2614}.btn{border:0;border-radius:9px;background:var(--green);color:#fff;padding:10px 14px;font-weight:650;font-size:12px;cursor:pointer}.btn.secondary{background:#edf3ef;color:#315c49}.btn.danger{background:#fff0ee;color:#a84135}.actions{display:flex;gap:6px}.empty{padding:28px;text-align:center;color:#8a978f;font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:11px;color:#586b60;font-weight:650;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dce5dd;border-radius:8px;background:#fff;padding:10px 11px;font:inherit;font-size:13px;color:#24372d}.field input:focus,.field select:focus{outline:2px solid #b7d8c3;border-color:#57906d}.field.full{grid-column:1/-1}.notice{border-radius:9px;padding:11px 13px;font-size:12px;margin-bottom:15px;background:#eff7f0;color:#3b704c}.notice.error{background:#fff0ed;color:#a74537}.stack{display:grid;gap:18px}.login{max-width:420px;margin:9vh auto;padding:30px}.login h1{font-size:23px;margin:0 0 5px}.login form,.stack-form{display:grid;gap:14px}.hidden{display:none!important}.rule{height:1px;background:var(--line);margin:16px 0}.count{font-size:11px;background:#f1f5f2;color:#617468;padding:5px 8px;border-radius:7px}.wide{grid-column:1/-1}.subnav{display:flex;gap:8px;align-items:center}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}@media(max-width:560px){.top{height:64px;padding:0 16px}.top-right #user-name{display:none}main{padding:23px 15px 40px}.heading{align-items:start;gap:12px;flex-direction:column}.heading h1{font-size:24px}.grid{gap:9px}.metric{padding:14px}.metric-value{font-size:25px}.metric-label{font-size:11px}.panel{padding:15px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.tabs{overflow:auto}.tab{white-space:nowrap}}
.maint-check{display:flex;align-items:center;gap:6px;color:#38634e;font-size:11px;font-weight:650;cursor:pointer}.maint-check input{accent-color:#17634c;width:15px;height:15px}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo-box{border:1px dashed #bacabe;border-radius:10px;padding:13px;background:#f8faf8}.photo-preview{display:none;width:100%;height:120px;object-fit:cover;border-radius:7px;margin-top:9px}.alert-dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 28px));box-shadow:0 25px 80px #102c2070;color:#20382d}.alert-dialog::backdrop{background:#10241e88;backdrop-filter:blur(3px)}.alert-head{padding:20px 22px 14px;border-bottom:1px solid var(--line)}.alert-head h2{margin:0;font-size:19px}.alert-body{padding:12px 22px;max-height:55vh;overflow:auto}.alert-item{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #eef2ee;font-size:13px}.alert-item:last-child{border-bottom:0}.alert-foot{padding:12px 22px 20px;display:flex;justify-content:flex-end}.photo-link{display:inline-block;color:#17634c;font-weight:600;margin-right:6px;font-size:11px}td select{border:1px solid #dce5dd;border-radius:7px;padding:6px 8px;background:white;color:#24372d;font:inherit;font-size:11px}.subnav{flex-wrap:wrap;justify-content:flex-end}@media(max-width:560px){.photo-grid{grid-template-columns:1fr}}
</style></head>
<body><div id="app" class="shell"><header class="top"><div class="brand"><span class="brand-icon">⚙</span><span>Control de Equipos<small>Operación y mantenimiento</small></span></div><div id="top-right" class="top-right hidden"><span id="user-name"></span><button id="logout" class="ghost">Salir</button></div></header><main id="main"></main></div>
<script>
const main=document.querySelector('#main');let session=null,equipment=[],readings=[],users=[],tab='overview';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('es-DO',{maximumFractionDigits:1}).format(Number(n)||0);const statusName={ok:'Al día',near:'Próximo',critical:'Crítico',urgent:'Urgente'};const statusClass={ok:'ok',near:'near',critical:'critical',urgent:'urgent'};
async function api(path,options={}){const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await r.json();if(!r.ok)throw Error(data.error||'No se pudo completar la solicitud');return data}function notice(text,error=false){return `<div class="notice ${error?'error':''}">${esc(text)}</div>`}
function login(){document.querySelector('#top-right').classList.add('hidden');main.innerHTML=`<section class="panel login"><div class="brand-icon" style="margin-bottom:18px">⚙</div><h1>Iniciar sesión</h1><p class="sub" style="margin:6px 0 22px">Accede al registro y control de equipos.</p><div id="message"></div><form id="login-form"><div class="field"><label>Usuario</label><input name="username" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div><label style="display:flex;gap:8px;align-items:center;margin:8px 0 14px"><input id="show-password" type="checkbox"> Mostrar contraseña</label><button class="btn" style="padding:12px">Entrar</button></form><button class="btn secondary" style="margin-top:12px" id="forgot-password" type="button">Solicitar restablecimiento de contraseña</button><p class="sub" style="margin-top:18px">Solicita tu usuario al administrador del sistema.</p></section>`;document.querySelector('#show-password').onchange=e=>document.querySelector('#login-password').type=e.target.checked?'text':'password';document.querySelector('#forgot-password').onclick=async()=>{const username=prompt('Escribe tu nombre de usuario'),email=prompt('Escribe el correo registrado en tu cuenta');if(!username||!email)return;try{const result=await api('/request-password-reset',{method:'POST',body:JSON.stringify({username,email})});document.querySelector('#message').innerHTML=notice(result.message)}catch(err){document.querySelector('#message').innerHTML=notice(err.message,true)}};document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});await start()}catch(err){document.querySelector('#message').innerHTML=notice(err.message,true)}}}
function changePasswordView(){main.innerHTML=`<section class="panel login"><h1>Cambiar contraseña</h1><p class="sub">Tu contraseña provisional debe cambiarse para continuar.</p><div id="message"></div><form id="change-password-form"><div class="field"><label>Nueva contraseña (mínimo 8 caracteres)</label><input name="password" type="password" minlength="8" required></div><button class="btn">Guardar contraseña nueva</button></form></section>`;document.querySelector('#change-password-form').onsubmit=async e=>{e.preventDefault();try{await api('/password/change',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});session.must_change_password=false;await start()}catch(error){document.querySelector('#message').innerHTML=notice(error.message,true)}}}
async function load(){const [e,r]=await Promise.all([api('/equipment'),api('/readings')]);equipment=e.equipment;readings=r.readings;if(session?.role==='admin'||session?.user_type==='transfer')users=(await api('/users')).users}let pollTimer=null;function layout(){document.querySelector('#top-right').classList.remove('hidden');document.querySelector('#user-name').textContent=session.username+(session.role==='admin'?' · Administrador':session.user_type==='transfer'?' · Transferencia':' · Registro');document.querySelector('#logout').onclick=async()=>{clearInterval(pollTimer);await api('/logout',{method:'POST'});session=null;login()};if(session.must_change_password){changePasswordView();return}if(session.role==='admin'){adminView();clearInterval(pollTimer);pollTimer=setInterval(()=>{if(tab==='overview'&&!document.querySelector('dialog[open]'))refresh().catch(()=>{})},15000)}else if(session.user_type==='transfer')transferView();else fieldViewV2()}
function metric(label,value,note){return `<article class="card metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></article>`}function equipmentTable(rows=equipment){if(!rows.length)return '<div class="empty">Todavía no hay equipos registrados.</div>';return `<div class="table-wrap"><table><thead><tr><th>Ficha / equipo</th><th>Marca y modelo</th><th>Horómetro</th><th>Próximo servicio</th><th>Restan</th><th>Estado</th><th>Usuario asignado</th><th>Acción</th></tr></thead><tbody>${rows.map(e=>`<tr><td class="code">${esc(e.code)}</td><td>${esc(e.brand)} ${esc(e.model)}</td><td>${fmt(e.latest_hours)} h</td><td>${fmt(e.due_hours)} h</td><td>${e.remaining_hours<0?`${fmt(Math.abs(e.remaining_hours))} h vencido`: `${fmt(e.remaining_hours)} h`}</td><td><span class="tag ${statusClass[e.maintenance_state]}">${statusName[e.maintenance_state]}</span></td><td><select data-assignment="${e.id}" aria-label="Usuario asignado a ${esc(e.code)}"><option value="">Sin asignar</option>${users.map(u=>`<option value="${u.id}" ${Number(e.assigned_user_id)===u.id?'selected':''}>${esc(u.username)}</option>`).join('')}</select></td><td><label class="maint-check"><input type="checkbox" data-maintenance="${e.id}"> Mantenimiento realizado</label></td></tr>`).join('')}</tbody></table></div>`}
function header(title,desc,tag=''){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${tag?`<span class="pill">${tag}</span>`:''}</div>`}
function downloadServiceRecord(record){const date=new Date(record.created_at.replace(' ','T')+'Z'),dateText=date.toLocaleString('es-DO',{dateStyle:'long',timeStyle:'short'}),html=`<!doctype html><html lang="es"><meta charset="utf-8"><title>Ficha de mantenimiento ${esc(record.code)}</title><style>body{font:15px Arial,sans-serif;color:#18372c;max-width:850px;margin:36px auto;padding:0 24px}header{border-bottom:3px solid #17634c;padding-bottom:16px;margin-bottom:24px}h1{margin:0;font-size:26px}small{color:#60746a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cell{border:1px solid #ccd8cf;border-radius:8px;padding:12px}.label{display:block;color:#60746a;font-size:11px;text-transform:uppercase;margin-bottom:6px}.wide{grid-column:1/-1}.value{font-weight:600;white-space:pre-wrap}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:90px}.signatures div{border-top:1px solid #526a5d;text-align:center;padding-top:8px;color:#60746a;font-size:12px}@media print{body{margin:0 auto}}</style><header><h1>Ficha de control de mantenimiento</h1><small>Folio ${record.id} · Registrado el ${esc(dateText)}</small></header><section class="grid"><div class="cell"><span class="label">Ficha del equipo</span><span class="value">${esc(record.code)}</span></div><div class="cell"><span class="label">Marca y modelo</span><span class="value">${esc(record.brand)} ${esc(record.model)}</span></div><div class="cell"><span class="label">Número de serie</span><span class="value">${esc(record.serial||'—')}</span></div><div class="cell"><span class="label">Horómetro al realizar el mantenimiento</span><span class="value">${fmt(record.hours)} horas</span></div><div class="cell wide"><span class="label">Insumos utilizados</span><div class="value">${esc(record.supplies).replace(/\n/g,'<br>')}</div></div><div class="cell"><span class="label">Mecánico responsable</span><span class="value">${esc(record.mechanic)}</span></div><div class="cell"><span class="label">Registrado por</span><span class="value">${esc(record.recorded_by)}</span></div></section><section class="signatures"><div>Firma del mecánico</div><div>Firma de supervisión</div></section></html>`;const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=`ficha_mantenimiento_${record.code.replace(/[^a-z0-9_-]/gi,'_')}_${record.id}.html`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function adminView(){
  const count=s=>equipment.filter(e=>e.maintenance_state===s).length;
  const active=equipment.filter(e=>e.maintenance_state!=='ok');
  const alertRows=active.map(e=>`<div class="alert-item"><span><strong>${esc(e.code)}</strong> · ${esc(e.brand)} ${esc(e.model)}<br><span class="sub">${e.remaining_hours<0?`${fmt(Math.abs(e.remaining_hours))} horas vencido`:`Faltan ${fmt(e.remaining_hours)} horas`}</span></span><span class="tag ${statusClass[e.maintenance_state]}">${statusName[e.maintenance_state]}</span></div>`).join('');
  main.innerHTML=`${header('Panel de mantenimiento','Resumen de flota y reportes enviados desde campo.',new Date().toLocaleDateString('es-DO',{day:'numeric',month:'long',year:'numeric'}))}<div class="grid">${metric('Equipos registrados',equipment.length,'Inventario activo')}${metric('Próximos',count('near'),'Dentro del umbral configurado')}${metric('Críticos',count('critical'),'En el punto de mantenimiento')}${metric('Urgentes',count('urgent'),'Horas de mantenimiento excedidas')}</div><section class="panel"><div class="panel-header"><div><h2>Flota y mantenimiento</h2><div class="sub">Marca la casilla para registrar un mantenimiento realizado y comenzar el siguiente ciclo.</div></div><div class="subnav"><button class="btn secondary" data-tab="users">+ Usuario</button><button class="btn secondary" data-tab="import">↑ Importar inventario</button><button class="btn" data-tab="equipment">+ Equipo</button></div></div>${equipmentTable()}</section><section class="panel" style="margin-top:18px"><div class="panel-header"><div><h2>Reportes de campo</h2><div class="sub">Las lecturas recibidas actualizan el horómetro y quedan pendientes de revisión.</div></div><span class="count">${readings.filter(r=>r.status==='pending').length} pendientes</span></div>${readingsTableWithPhotos()}</section><dialog class="alert-dialog" id="maintenance-alert"><div class="alert-head"><h2>⚠ Alertas de mantenimiento</h2><div class="sub">Hay equipos que requieren atención.</div></div><div class="alert-body">${alertRows}</div><div class="alert-foot"><button class="btn" id="close-alert">Entendido</button></div></dialog><dialog class="alert-dialog" id="service-dialog"><div class="alert-head"><h2>Registrar mantenimiento</h2><div class="sub" id="service-equipment-name"></div></div><form id="service-form" class="stack-form" style="padding:18px 22px"><div id="service-message"></div><div class="field"><label>Horómetro al momento del mantenimiento</label><input id="service-hours" name="hours" type="number" min="0" step="0.1" required></div><div class="field"><label>Mecánico que realizó el mantenimiento</label><input name="mechanic" maxlength="150" required></div><div class="field"><label>Insumos utilizados</label><textarea name="supplies" rows="4" maxlength="4000" placeholder="Ej.: aceite 15W-40 (8 galones), filtros…" required></textarea></div><div class="actions" style="justify-content:flex-end"><button type="button" class="btn secondary" id="cancel-service">Cancelar</button><button class="btn" id="save-service">Guardar y generar ficha</button></div></form></dialog>`;
  const exportButton=document.createElement('button');exportButton.className='btn secondary';exportButton.textContent='Descargar Excel y fotos';exportButton.onclick=async()=>{exportButton.disabled=true;exportButton.textContent='Preparando archivos…';try{await exportWorkbookBundle()}catch(error){alert(`No se pudo preparar la descarga: ${error.message}`)}finally{exportButton.disabled=false;exportButton.textContent='Descargar Excel y fotos'}};main.querySelectorAll('.panel-header')[1]?.append(exportButton);
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;adminSubView()});
  document.querySelectorAll('[data-assignment]').forEach(select=>select.onchange=async()=>{select.disabled=true;try{await api(`/equipment/${select.dataset.assignment}/assignment`,{method:'POST',body:JSON.stringify({user_id:select.value||null})});await refresh()}catch(error){alert(error.message);select.disabled=false}});
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{await api(`/readings/${b.dataset.id}/${b.dataset.action}`,{method:'POST'});await refresh()}catch(e){alert(e.message)}});
  const serviceDialog=document.querySelector('#service-dialog'),serviceForm=document.querySelector('#service-form');
  document.querySelectorAll('[data-maintenance]').forEach(input=>input.onchange=()=>{if(!input.checked)return;const item=equipment.find(e=>e.id===Number(input.dataset.maintenance));if(!item)return;serviceDialog.dataset.equipment=item.id;serviceDialog.dataset.saved='';serviceForm.reset();document.querySelector('#service-equipment-name').textContent=`${item.code} · ${item.brand} ${item.model}`;const hoursInput=document.querySelector('#service-hours');hoursInput.min=item.last_service_hours;hoursInput.max=item.latest_hours;hoursInput.value=item.latest_hours;serviceDialog.showModal()});
  document.querySelector('#cancel-service').onclick=()=>serviceDialog.close();
  serviceDialog.addEventListener('close',()=>{if(serviceDialog.dataset.saved!=='true'){const input=document.querySelector(`[data-maintenance="${serviceDialog.dataset.equipment}"]`);if(input)input.checked=false}});
  serviceForm.onsubmit=async event=>{event.preventDefault();const button=document.querySelector('#save-service');button.disabled=true;try{const values=Object.fromEntries(new FormData(serviceForm)),result=await api(`/equipment/${serviceDialog.dataset.equipment}/maintenance`,{method:'POST',body:JSON.stringify(values)});downloadServiceRecord(result.record);serviceDialog.dataset.saved='true';serviceDialog.close();await refresh();alert('Mantenimiento guardado. Se descargó la ficha de control; puedes abrirla e imprimirla o guardarla como PDF.')}catch(error){document.querySelector('#service-message').innerHTML=notice(error.message,true)}finally{button.disabled=false}};
  const close=document.querySelector('#close-alert');if(close)close.onclick=()=>document.querySelector('#maintenance-alert').close();
  if(active.length){const key=active.map(e=>`${e.id}:${e.maintenance_state}`).sort().join('|');if(sessionStorage.getItem('maintenance-alert-state')!==key){sessionStorage.setItem('maintenance-alert-state',key);document.querySelector('#maintenance-alert').showModal()}}else sessionStorage.removeItem('maintenance-alert-state');
}
function readingsTable(){if(!readings.length)return '<div class="empty">Aún no se han recibido lecturas.</div>';return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Equipo</th><th>Operador</th><th>Horómetro</th><th>Comentarios</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${readings.map(r=>`<tr><td>${new Date(r.created_at+'Z').toLocaleString('es-DO',{dateStyle:'short',timeStyle:'short'})}</td><td class="code">${esc(r.code)}</td><td>${esc(r.username)}</td><td>${fmt(r.hours)} h</td><td>${esc(r.comments)||'—'}</td><td><span class="tag ${r.status==='pending'?'near':r.status==='confirmed'?'ok':'urgent'}">${r.status==='pending'?'Pendiente':r.status==='confirmed'?'Confirmado':'Rechazado'}</span></td><td>${r.status==='pending'?`<div class="actions"><button class="btn" data-action="confirm" data-id="${r.id}">Confirmar</button><button class="btn danger" data-action="reject" data-id="${r.id}">Rechazar</button></div>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}

  if(form)form.onsubmit=async event=>{event.preventDefault();const files=[document.querySelector('#photo-one').files[0],document.querySelector('#photo-two').files[0]],button=document.querySelector('#send-reading');button.disabled=true;button.textContent='Enviando fotos y lectura…';try{const values=Object.fromEntries(new FormData(form));values.photos=await Promise.all(files.map(readPhoto));await api('/readings',{method:'POST',body:JSON.stringify(values)});await refresh();alert('Lectura recibida. El horómetro y el estado de mantenimiento ya fueron actualizados.')}catch(error){document.querySelector('#message').innerHTML=notice(error.message,true);button.disabled=false;button.textContent='Enviar lectura'}};
}
function transferView(){main.innerHTML=`${header('Transferencia de equipos','Asigna cada equipo al encargado de registro que lo tendrá a su cargo.')}<section class="panel"><div class="panel-header"><h2>Equipos y responsables</h2></div>${equipmentTable()}</section>`;document.querySelectorAll('[data-assignment]').forEach(select=>select.onchange=async()=>{try{await api(`/equipment/${select.dataset.assignment}/assignment`,{method:'POST',body:JSON.stringify({user_id:select.value||null})});await refresh()}catch(error){alert(error.message)}})}
async function refresh(){await load();if(session?.role==='admin'&&tab==='overview'&&document.querySelector('dialog[open]'))return;layout()}async function start(){try{const {user}=await api('/session');if(!user)return login();session=user;if(session.must_change_password){changePasswordView();return}if(session.role==='admin')tab='overview';await load();layout()}catch{login()}}
start();
</script></body></html>
